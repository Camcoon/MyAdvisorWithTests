$kind: http-request
description: Malformed cookie denied. Run the complete collection in order against the disposable local database; see README.md.
url: "{{base_url}}/api/degree-progress"
method: GET
headers:
  Accept: application/json
  Cookie: access_token={{invalid_token}}
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set("invalid_token", "not-a-jwt");
      Object.keys(pm.collectionVariables.toObject()).forEach(k => pm.variables.set(k, pm.collectionVariables.get(k)));
    language: text/javascript
  - type: afterResponse
    code: |-
      try {
      let assertionFailed = false;
      function check(name, fn) {
        pm.test(name, function() {
          try { fn(); } catch (error) { assertionFailed = true; throw error; }
        });
      }
      check("HTTP 401", () => pm.response.to.have.status(401));
      check("JSON response", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));
      const data = pm.response.json();
      check("Error detail returned", () => pm.expect(data).to.have.property("detail"));
      if (pm.request.url.toString().includes("/api/") && pm.response.code >= 200 && pm.response.code < 300) {
        check("Nested response contracts", () => {
          function course(c) {
            ["id","code","title","credits","category","department","prerequisite_text"].forEach(k => pm.expect(c).to.have.property(k));
            pm.expect(Number.isSafeInteger(c.id) && c.id > 0).to.eql(true);
            pm.expect(c.credits).to.be.a("number").and.at.least(0);
            ["code","title","category","department","prerequisite_text"].forEach(k => pm.expect(c[k]).to.be.a("string"));
          }
          function plan(p, advisor) {
            const keys = ["id","semester_name","status","submitted_at","advisor_feedback","courses"];
            pm.expect(p).to.have.all.keys(advisor ? keys.concat(["advisor_id","student","program"]) : keys);
            pm.expect(Number.isSafeInteger(p.id) && p.id > 0).to.eql(true);
            pm.expect(p.semester_name).to.match(/^Year [1-3] semester [1-3]$/);
            pm.expect(p.status).to.be.oneOf(["Pending","Approved","Rejected","Changes Requested","Cancelled"]);
            pm.expect(p.submitted_at).to.be.a("string"); pm.expect(Number.isNaN(Date.parse(p.submitted_at))).to.eql(false);
            pm.expect(p.advisor_feedback).to.be.a("string"); pm.expect(p.advisor_feedback.length).to.be.at.most(500);
            pm.expect(p.courses).to.be.an("array").that.is.not.empty; p.courses.forEach(course);
            if (advisor) {
              pm.expect(p.student === null || typeof p.student === "object").to.eql(true);
              if (p.student) pm.expect(p.student).to.have.all.keys("id","name","username","student_number");
              if (p.id === Number(pm.collectionVariables.get("plan_id"))) {
                pm.expect(p.student.id).to.eql(Number(pm.collectionVariables.get("student_id")));
                pm.expect(p.student.username).to.eql(pm.collectionVariables.get("student_username"));
              }
            }
          }
          const url = pm.request.url.toString();
          if (url.includes("/api/semester-plans") || url.includes("/api/advisor/plans")) {
            (Array.isArray(data) ? data : [data]).forEach(p => plan(p, url.includes("/api/advisor/")));
          } else if (url.includes("/api/degree-progress")) {
            data.completed.forEach(course); data.in_progress.forEach(course);
            pm.expect(data.completed_credits).to.eql(data.completed.reduce((sum,c) => sum+c.credits,0));
            pm.expect(data.in_progress_credits).to.eql(data.in_progress.reduce((sum,c) => sum+c.credits,0));
          } else if (url.includes("/api/courses")) data.forEach(course);
        });
      }
      if ([401,403].includes(pm.response.code)) check("Exact authorization error", () => {
        pm.expect(data).to.have.all.keys("detail");
        pm.expect(data.detail).to.eql(pm.response.code === 401 ? "Could not validate credentials" : "You are not authorized to access this resource");
      });
      if ([404,409,422].includes(pm.response.code) && !Array.isArray(data.detail)) check("Domain error structure", () => {
        pm.expect(data).to.have.all.keys("detail"); pm.expect(data.detail).to.have.all.keys("code","message");
        pm.expect(data.detail.message).to.be.a("string").and.not.empty;
      });
      if (assertionFailed) pm.execution.setNextRequest(null);
      } catch (error) { pm.execution.setNextRequest(null); throw error; }
    language: text/javascript
settings:
  followRedirects: false
  disableCookies: true
order: 7000
